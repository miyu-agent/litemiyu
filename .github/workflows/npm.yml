# 把一次已经公开的发布发到 npm：主包发两个名字（litemiyu 和 @miyu-agent/litemiyu，内容一样），加每个平台一个的包
# （@miyu-agent/litemiyu-linux-x64、-linux-arm64、-darwin-arm64），一共五个包。
# 手动触发：`gh workflow run npm.yml -f tag=<标签> -f dry_run=false`。
#
# 不用任何密钥：发布用 npm 的可信发布（trusted publishing）。GitHub 给这一趟工作流签发一份身份凭证，npm 认「miyu-agent/litemiyu
# 仓库的 npm.yml」这个身份；五个包各自在 npmjs.com 的设置页里配了这个可信发布方，并且允许它直接 npm publish。所以：
# - 这个文件不能改名、不能搬到别的仓库：改了 npm 那边就认不出来，要在五个包的设置页里删掉旧的、重新配；
# - 五个包的 package.json 里 repository.url 必须是这个仓库（packaging/npm/ 下的模板里写着），npm 要求两边一致；
# - 发布的那个任务要有 id-token: write，要 Node.js 22.14 以上、npm 11.5.1 以上（下面装的是 Node.js 24）；
# - npm publish 不带令牌，也不用带 --provenance：npm 的文档写着，从公开仓库用可信发布时会自动生成构建出处证明。
# 只用 GitHub 官方的 action。
#
# 做法：
# 1. prepare：取模板，下载这次发布的 SHA256SUMS 和三个压缩包，核对哈希和构建出处证明，用 `cargo xtask packaging --archives`
#    出五个包的目录（平台包里的程序就是压缩包里的那一份，一字不差），`npm pack` 打成五个 .tgz；在这台机器上装一遍、跑一下；
#    再对每个 .tgz 做一遍 `npm publish --dry-run`。这个任务拿不到发布的身份凭证。
# 2. publish：把上一步的五个 .tgz 原样发到 npm，先发三个平台包，最后发主包的两个名字。已经发过的那个版本跳过，所以中途失败以后
#    可以原样再跑一次。演练时这一步照样跑，每个包都带 --dry-run。这一步不运行任何从别处下载的程序。
#
# 预发布版（标签带 -rc.N）发在 rc 这个标记下，正式版发在 latest 下。
#
# 改了模板以后，先照演练跑一遍（dry_run 默认是开着的）。

name: npm
run-name: npm ${{ inputs.tag }}${{ inputs.dry_run && '（演练）' || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: LiteMiyu 的发版标签，例如 v2026.11.0
        required: true
        type: string
      templates_ref:
        description: 模板取自这个仓库的哪个分支、标签或提交；不写就是上面的标签
        required: false
        type: string
        default: ''
      dry_run:
        description: 只演练：核对、打包、试装，不发到 npm
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm
  cancel-in-progress: false

env:
  SOURCE_REPO: miyu-agent/litemiyu
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 标签的样子对
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::标签 ${TAG} 不是 v<年>.<月>.<序号> 或者带 -rc.N 的"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.templates_ref || inputs.tag }}
          persist-credentials: false
      - name: 下载这次发布的校验文件和三个压缩包，核对哈希和构建出处
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p "${RUNNER_TEMP}/assets"
          cd "${RUNNER_TEMP}/assets"
          gh release download "${TAG}" -R "${SOURCE_REPO}" -p SHA256SUMS -p "litemiyu-${version}-*.tar.gz"
          for platform in linux-x86_64 linux-aarch64 macos-aarch64; do
            file="litemiyu-${version}-${platform}.tar.gz"
            grep -E "  \*?${file//./\\.}\$" SHA256SUMS | sha256sum -c -
            gh attestation verify "${file}" -R "${SOURCE_REPO}"
          done
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 出五个包的目录，打成 .tgz
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node --version
          npm --version
          cargo xtask packaging "${TAG}" --sums "${RUNNER_TEMP}/assets/SHA256SUMS" --archives "${RUNNER_TEMP}/assets" --out "${RUNNER_TEMP}/out"
          mkdir -p "${RUNNER_TEMP}/tgz"
          cd "${RUNNER_TEMP}/tgz"
          for dir in litemiyu-linux-x64 litemiyu-linux-arm64 litemiyu-darwin-arm64 litemiyu litemiyu-scoped; do
            npm pack "${RUNNER_TEMP}/out/npm/${dir}"
          done
          ls -l
      - name: 装一遍、跑一下
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tgz="${RUNNER_TEMP}/tgz"
          mkdir -p "${RUNNER_TEMP}/try"
          cd "${RUNNER_TEMP}/try"
          echo '{"name":"try","private":true}' > package.json
          # 另外两个平台的包还没有发到 npm 上：它们是可选依赖，取不到不算错。
          # 先不让安装脚本跑（新的 npm 默认就不跑）：这时候命令是启动用的脚本。
          npm install --ignore-scripts "${tgz}/litemiyu-${version}.tgz" "${tgz}/miyu-agent-litemiyu-linux-x64-${version}.tgz"
          wanted="litemiyu ${version}"
          # 一、经启动脚本。
          head -c 2 node_modules/litemiyu/bin/litemiyu | grep -q '#!' || { echo "::error::没有跑安装脚本，命令却不是启动脚本"; exit 1; }
          printed=$(./node_modules/.bin/litemiyu --version)
          echo "经启动脚本：${printed}"
          [ "${printed}" = "${wanted}" ] || { echo "::error::应该是 ${wanted}"; exit 1; }
          # 二、脚本跑过以后：命令就是程序，和压缩包里的一字不差。
          (cd node_modules/litemiyu && node install.js)
          printed=$(./node_modules/.bin/litemiyu --version)
          echo "直接是程序：${printed}"
          [ "${printed}" = "${wanted}" ] || { echo "::error::应该是 ${wanted}"; exit 1; }
          tar -xzf "${RUNNER_TEMP}/assets/litemiyu-${version}-linux-x86_64.tar.gz" -C "${RUNNER_TEMP}"
          cmp node_modules/litemiyu/bin/litemiyu "${RUNNER_TEMP}/litemiyu-${version}-linux-x86_64/litemiyu"
          cmp node_modules/@miyu-agent/litemiyu-linux-x64/bin/litemiyu "${RUNNER_TEMP}/litemiyu-${version}-linux-x86_64/litemiyu"
          # 三、带组织前缀的那个名字（@miyu-agent/litemiyu）装出来是同一个程序。
          mkdir -p "${RUNNER_TEMP}/try-scoped"
          cd "${RUNNER_TEMP}/try-scoped"
          echo '{"name":"try-scoped","private":true}' > package.json
          npm install --ignore-scripts "${tgz}/miyu-agent-litemiyu-${version}.tgz" "${tgz}/miyu-agent-litemiyu-linux-x64-${version}.tgz"
          printed=$(./node_modules/.bin/litemiyu --version)
          echo "带前缀的名字：${printed}"
          [ "${printed}" = "${wanted}" ] || { echo "::error::应该是 ${wanted}"; exit 1; }
      - name: 每个包照 npm publish --dry-run 过一遍
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${TAG}" in *-rc.*) disttag=rc ;; *) disttag=latest ;; esac
          for file in "${RUNNER_TEMP}"/tgz/*.tgz; do
            npm publish "${file}" --access public --tag "${disttag}" --dry-run
          done
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/tgz/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: tgz
      # 演练时这一步照样跑，只是每个包都带 --dry-run：发布用的命令和真发时是同一份，写错了演练就能看出来。
      - name: 发到 npm（演练时只走一遍 --dry-run）
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node --version
          npm --version
          # 可信发布要 npm 11.5.1 以上。
          lowest="11.5.1"
          [ "$(printf '%s\n%s\n' "${lowest}" "$(npm --version)" | sort -V | head -n 1)" = "${lowest}" ] \
            || { echo "::error::npm $(npm --version) 太旧，可信发布要 ${lowest} 以上"; exit 1; }
          version="${TAG#v}"
          case "${TAG}" in *-rc.*) disttag=rc ;; *) disttag=latest ;; esac
          extra=()
          if [ "${DRY_RUN}" = "true" ]; then
            extra=(--dry-run)
          fi
          ls -l tgz
          publish() {
            local name="$1" file="$2"
            [ -f "${file}" ] || { echo "::error::没有 ${file}"; exit 1; }
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} 已经在 npm 上，跳过"
            else
              # 路径要以 ./ 开头：npm 把「目录/文件」这样的写法当成 GitHub 仓库的简写。
              npm publish "./${file}" --access public --tag "${disttag}" "${extra[@]}"
            fi
          }
          for platform in linux-x64 linux-arm64 darwin-arm64; do
            publish "@miyu-agent/litemiyu-${platform}" "tgz/miyu-agent-litemiyu-${platform}-${version}.tgz"
          done
          publish litemiyu "tgz/litemiyu-${version}.tgz"
          publish "@miyu-agent/litemiyu" "tgz/miyu-agent-litemiyu-${version}.tgz"
          if [ "${DRY_RUN}" != "true" ]; then
            # npm 收下一个包以后要处理一会儿才查得到（发的时候它会印「Your package is being processed and may take a few
            # minutes to become available」）。第一次发的包，处理期间注册表上先只有一个 0.0.0-stage 的占位版本，处理完
            # 才换成真的；这不是出错，也不用谁去批准。这里最多等十分钟。
            for _ in $(seq 1 60); do
              if npm view "litemiyu@${version}" name version dist-tags 2>/dev/null \
                && npm view "@miyu-agent/litemiyu@${version}" name version dist-tags 2>/dev/null; then
                exit 0
              fi
              sleep 10
            done
            echo "::error::等了十分钟，npm 上还看不到 litemiyu@${version} 或者 @miyu-agent/litemiyu@${version}。上面五个包的 npm publish 都印了「+ 包名@版本」的话，包已经交上去了：过一会儿再用 npm view litemiyu 看，不要重发。"
            npm view litemiyu name version dist-tags || true
            exit 1
          fi
